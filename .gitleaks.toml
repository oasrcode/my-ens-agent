# gitleaks configuration for the public `ens-audit` repository.
#
# This file EXTENDS gitleaks' built-in default ruleset (`useDefault = true`):
# every default detection rule stays active. It only adds a single, narrow
# allowlist; detection is NOT weakened anywhere else.
#
# The allowlist covers `tests/fixtures/`, which ships in the public repo as a
# curated subset and holds INTENTIONALLY vulnerable / insecure sample files
# (fake API keys, JWTs, private keys, weak crypto). Their defects are the
# fixtures' whole purpose: the deterministic scanners under test must flag them.
# See `tests/README.md` ("Secrets in fixtures are fictional").
#
# COMPATIBILITY: this uses the SINGULAR classic `[allowlist]` table, NOT the
# plural `[[allowlists]]` form. gitleaks 8.24.3 -- the version that
# gitleaks/gitleaks-action@v3 installs by default -- SILENTLY IGNORES the plural
# form, leaving the intentional fixture secrets un-allowlisted and turning CI
# red. The singular form is honoured by BOTH 8.24.3 and 8.30.1, so it works
# across versions. The workflow pins GITLEAKS_VERSION to 8.30.1 for determinism.
#
# NOTE: this file configures gitleaks ONLY. It does NOT configure GitHub Secret
# Scanning; any GitHub alerts on these fixture paths are known false positives.
#
# NOTE: do NOT add secrets here — this file contains no secret values.

[extend]
useDefault = true

[allowlist]
description = "Intentionally vulnerable scanner fixtures (fictional secrets are the point)"
paths = [
  '''tests/fixtures/''',
]
