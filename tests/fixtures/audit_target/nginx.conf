# Intentionally insecure fixture: deprecated TLS protocols and weak ciphers.
server {
    listen 80;
    listen 443 ssl;
    server_name audit-target.example.net;

    ssl_protocols TLSv1 TLSv1.1;
    ssl_ciphers RC4-SHA:DES-CBC3-SHA;

    location / {
        proxy_pass http://10.0.0.5:8080;
    }
}
