[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ens-audit"
version = "0.1.0"
description = "ENS (RD 311/2022) audit tooling: catalog, deterministic scanners, compliance evaluator and report generators."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "pydantic",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
ens-audit-mcp = "ens_audit.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ens_audit"]

[tool.ruff]
# `tests/fixtures/**` holds intentionally vulnerable/insecure samples that the
# scanners must flag; they are excluded from lint by repo convention (AGENTS.md).
extend-exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
